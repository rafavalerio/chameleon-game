<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Chameleon body -->
  <ellipse cx="256" cy="280" rx="140" ry="100" fill="url(#body)"/>
  
  <!-- Chameleon head -->
  <circle cx="340" cy="220" r="70" fill="url(#body)"/>
  
  <!-- Eye outer -->
  <circle cx="360" cy="210" r="35" fill="#fff"/>
  
  <!-- Eye inner -->
  <circle cx="365" cy="210" r="18" fill="#1f2937"/>
  
  <!-- Eye highlight -->
  <circle cx="372" cy="202" r="6" fill="#fff"/>
  
  <!-- Chameleon crest/horn -->
  <path d="M 380 160 Q 400 120 370 100 Q 340 120 350 160 Z" fill="url(#body)"/>
  
  <!-- Tail curl -->
  <path d="M 116 280 Q 80 280 70 320 Q 60 380 100 400 Q 140 420 160 380 Q 170 350 140 340" 
        stroke="url(#body)" stroke-width="30" fill="none" stroke-linecap="round"/>
  
  <!-- Feet -->
  <ellipse cx="200" cy="370" rx="25" ry="15" fill="#059669"/>
  <ellipse cx="300" cy="370" rx="25" ry="15" fill="#059669"/>
  
  <!-- Smile -->
  <path d="M 380 240 Q 370 260 350 250" stroke="#059669" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
